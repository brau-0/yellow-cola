name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore YellowCola.slnx

      - name: Build
        run: >
          dotnet build YellowCola.slnx
          --configuration Release
          --no-restore

      - name: Run unit tests
        shell: bash
        run: |
          shopt -s globstar nullglob

          projects=(tests/**/*UnitTests.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No unit test projects found."
            exit 1
          fi

          echo "Discovered unit test projects:"

          printf ' - %s\n' "${projects[@]}"

          for project in "${projects[@]}"; do
            echo "Running $project"

            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --no-restore
          done

      - name: Run integration tests
        shell: bash
        run: |
          shopt -s globstar nullglob

          projects=(tests/**/*IntegrationTests.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No integration test projects found."
            exit 1
          fi

          echo "Discovered integration test projects:"

          printf ' - %s\n' "${projects[@]}"

          for project in "${projects[@]}"; do
            echo "Running $project"

            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --no-restore
          done